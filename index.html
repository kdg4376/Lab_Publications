const host = document.getElementById('publications');
const make = (tag, className, text) => { const el=document.createElement(tag); if(className) el.className=className; if(text!==undefined) el.textContent=text; return el; };
function link(url,text,className){const a=make('a',className,text);a.href=url;a.target='_blank';a.rel='noopener noreferrer';return a;}
function authorsNode(text){const el=make('p','authors');const pieces=text.split(/(G\. D\. Cha)/g);for(const piece of pieces)el.append(piece==='G. D. Cha'?make('strong','',piece):document.createTextNode(piece));return el;}
function card(p){
 const article=make('article','paper');article.id='paper-'+p.id;
 const figure=make('div','figure');const img=make('img');img.src=p.image;img.alt='Figure for '+p.title;img.loading='lazy';img.decoding='async';img.addEventListener('error',()=>figure.replaceChildren(make('span','missing','Preview unavailable')),{once:true});figure.append(img);
 const info=make('div','info');info.append(make('span','number','PUBLICATION '+p.id));const heading=make('h3','title');heading.append(link(p.url,p.title));info.append(heading,authorsNode(p.authors));if(p.citation)info.append(make('p','citation',p.citation));info.append(link(p.url,'View article ↗','article-link'));article.append(figure,info);return article;
}
const sorted=[...publications].sort((a,b)=>b.year-a.year||b.id-a.id);
const years=[...new Set(sorted.map(p=>p.year))];
document.getElementById('overview').textContent=`${publications.length} publications · ${Math.min(...years)}–${Math.max(...years)}`;
let openYears=new Set([years[0]]);
function render(query=''){
 const q=query.trim().toLowerCase();const matched=sorted.filter(p=>!q||[p.title,p.authors,p.citation,p.year].join(' ').toLowerCase().includes(q));const fragment=document.createDocumentFragment();
 for(const year of years){const items=matched.filter(p=>p.year===year);if(!items.length)continue;
 const details=make('details','year');details.open=!!q||openYears.has(year);const summary=make('summary');summary.append(make('span','',String(year)),make('span','count',`${items.length} ${items.length===1?'publication':'publications'}`));const arrow=make('span','chevron');arrow.setAttribute('aria-hidden','true');summary.append(arrow);const list=make('div','paper-list');let dividerShown=false;
 for(const p of items){if(year===2023&&p.beforeChungAng&&!dividerShown){list.append(make('div','divider','Before Chung-Ang University'));dividerShown=true;}list.append(card(p));}
 details.append(summary,list);details.addEventListener('toggle',()=>{if(!document.getElementById('search').value.trim()){if(details.open)openYears.add(year);else openYears.delete(year);}});fragment.append(details);
 }
 if(!matched.length)fragment.append(make('p','empty','No publications match your search.'));
 host.replaceChildren(fragment);const status=document.getElementById('results');status.hidden=!q;status.textContent=`${matched.length} of ${publications.length} publications found.`;
}
document.getElementById('search').addEventListener('input',e=>render(e.target.value));
for(const [id,open] of [['expand',true],['collapse',false]])document.getElementById(id).addEventListener('click',()=>{host.querySelectorAll('details').forEach(d=>d.open=open);if(!document.getElementById('search').value.trim())openYears=new Set(open?years:[]);});
let printState=[];window.addEventListener('beforeprint',()=>{printState=[...host.querySelectorAll('details')].map(d=>[d,d.open]);printState.forEach(([d])=>d.open=true);});window.addEventListener('afterprint',()=>printState.forEach(([d,open])=>d.open=open));
render();
